# Verifies that committed plugin source files match what `make doofinder-configure`
# would produce from `templates/` and the canonical `.env`. Catches PRs that bump
# `.env` (or edit a template) without regenerating and committing the source.
name: Template drift check

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'doofinder-for-woocommerce/doofinder-for-woocommerce.php'
      - 'doofinder-for-woocommerce/readme.txt'
      - 'doofinder-for-woocommerce/includes/class-doofinder-constants.php'
      - '.env'
  push:
    paths:
      - 'templates/**'
      - 'doofinder-for-woocommerce/doofinder-for-woocommerce.php'
      - 'doofinder-for-woocommerce/readme.txt'
      - 'doofinder-for-woocommerce/includes/class-doofinder-constants.php'
      - '.env'

jobs:
  drift-check:
    name: Templates vs versioned files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate from templates (canonical env from .env)
        run: |
          set -a
          source .env
          set +a
          ENVSUBST_VARS='$PLUGIN_VERSION,$DOOFINDER_PLUGINS_URL_FORMAT,$DOOFINDER_API_URL_FORMAT,$DOOFINDER_LAYER_SCRIPT_URL'
          mkdir -p .drift-out/includes
          envsubst "$ENVSUBST_VARS" < templates/doofinder-for-woocommerce/doofinder-for-woocommerce.php > .drift-out/doofinder-for-woocommerce.php
          envsubst "$ENVSUBST_VARS" < templates/doofinder-for-woocommerce/readme.txt                       > .drift-out/readme.txt
          envsubst "$ENVSUBST_VARS" < templates/doofinder-for-woocommerce/includes/class-doofinder-constants.php    > .drift-out/includes/class-doofinder-constants.php

      - name: Diff doofinder-for-woocommerce.php
        run: |
          if ! diff -u doofinder-for-woocommerce/doofinder-for-woocommerce.php .drift-out/doofinder-for-woocommerce.php; then
            echo "::error::Drift: doofinder-for-woocommerce.php differs from template output. Run 'make doofinder-configure' and commit."
            exit 1
          fi
      - name: Diff readme.txt
        run: |
          if ! diff -u doofinder-for-woocommerce/readme.txt .drift-out/readme.txt; then
            echo "::error::Drift: readme.txt differs from template output. Run 'make doofinder-configure' and commit."
            exit 1
          fi
      - name: Diff class-doofinder-constants.php
        run: |
          if ! diff -u doofinder-for-woocommerce/includes/class-doofinder-constants.php .drift-out/includes/class-doofinder-constants.php; then
            echo "::error::Drift: class-doofinder-constants.php differs from template output. Run 'make doofinder-configure' and commit."
            exit 1
          fi
      - name: No drift
        run: 'echo "No template drift: versioned files match template output."'
