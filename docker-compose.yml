services:
  db:
    image: mysql:${MYSQL_VERSION}
    volumes:
      - wordpress-db:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"

  wordpress:
    depends_on:
      - db
    build:
      context: .
      args:
        WORDPRESS_IMAGE_TAG: ${WORDPRESS_IMAGE_TAG}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./html:/var/www/html/
      - ./doofinder-for-woocommerce:/var/www/html/wp-content/plugins/doofinder-for-woocommerce
    restart: unless-stopped
    environment:
      APACHE_RUN_USER: "#${APACHE_UID}"
      APACHE_RUN_GROUP: "#${APACHE_GID}"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN}
      WEB_SERVICE_PORT: ${WEB_SERVICE_PORT}
      WORDPRESS_VERSION: ${WORDPRESS_VERSION:-}
    ports:
      - "${WEB_SERVICE_PORT}:80"
volumes:
  wordpress-db:
